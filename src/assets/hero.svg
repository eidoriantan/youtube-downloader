<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" fill="none">
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff6a45" stop-opacity=".32"/>
      <stop offset=".6" stop-color="#8b5cf6" stop-opacity=".1"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a3d"/>
      <stop offset="1" stop-color="#ffb547"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2142"/>
      <stop offset="1" stop-color="#40233a"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".55" stop-color="#ff7a52"/>
      <stop offset="1" stop-color="#ffb547"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="560" height="440" fill="url(#dots)"/>
  <circle cx="290" cy="220" r="230" fill="url(#glow)"/>

  <!-- browser window with a video -->
  <g>
    <rect x="58" y="44" width="364" height="240" rx="22" fill="#1b1729" stroke="#342c48" stroke-width="1.5"/>
    <circle cx="84" cy="70" r="5" fill="#ff5a3d"/>
    <circle cx="102" cy="70" r="5" fill="#ffb547"/>
    <circle cx="120" cy="70" r="5" fill="#4b4163"/>
    <rect x="146" y="62" width="180" height="16" rx="8" fill="#262036"/>
    <rect x="78" y="94" width="324" height="170" rx="14" fill="url(#screen)"/>
    <path d="M78 214 L150 168 L214 206 L282 150 L402 222 V250 a14 14 0 0 1 -14 14 H92 a14 14 0 0 1 -14 -14 Z" fill="#ffffff" fill-opacity=".05"/>
    <circle cx="240" cy="172" r="36" fill="url(#ember)"/>
    <path d="M230 156 L254 172 L230 188 Z" fill="#fff7ec" stroke="#fff7ec" stroke-width="6" stroke-linejoin="round"/>
    <rect x="96" y="242" width="288" height="5" rx="2.5" fill="#ffffff" fill-opacity=".14"/>
    <rect x="96" y="242" width="190" height="5" rx="2.5" fill="url(#ember)"/>
    <circle cx="286" cy="244.5" r="7" fill="#fff7ec"/>
  </g>

  <!-- flow from the video into files -->
  <path d="M240 296 C240 330 270 336 300 334" stroke="#ff8a65" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M190 296 C190 320 170 324 150 330" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- audio file card -->
  <g transform="rotate(-3 410 330)">
    <rect x="300" y="262" width="226" height="138" rx="20" fill="#1f1a2e" stroke="#3a3150" stroke-width="1.5"/>
    <g fill="url(#bars)">
      <rect x="322" y="318" width="8" height="24" rx="4"/>
      <rect x="337" y="306" width="8" height="48" rx="4"/>
      <rect x="352" y="296" width="8" height="68" rx="4"/>
      <rect x="367" y="310" width="8" height="40" rx="4"/>
      <rect x="382" y="300" width="8" height="60" rx="4"/>
      <rect x="397" y="314" width="8" height="32" rx="4"/>
      <rect x="412" y="292" width="8" height="76" rx="4"/>
      <rect x="427" y="306" width="8" height="48" rx="4"/>
      <rect x="442" y="316" width="8" height="28" rx="4"/>
      <rect x="457" y="304" width="8" height="52" rx="4"/>
      <rect x="472" y="320" width="8" height="20" rx="4"/>
      <rect x="487" y="312" width="8" height="36" rx="4"/>
    </g>
    <text x="322" y="388" fill="#c4bcd3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">track.mp3 · 320k</text>
  </g>

  <!-- download badge -->
  <circle cx="512" cy="262" r="28" fill="url(#ember)"/>
  <path d="M512 248 V272 M501 262 L512 273 L523 262" stroke="#1a1020" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- video file chip -->
  <g>
    <rect x="34" y="326" width="196" height="60" rx="18" fill="#1f1a2e" stroke="#3a3150" stroke-width="1.5"/>
    <circle cx="66" cy="356" r="16" fill="#a78bfa" fill-opacity=".18"/>
    <path d="M59 356 L64 361 L74 350" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="352" fill="#fbf6ee" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">video.mp4</text>
    <text x="92" y="370" fill="#8a819f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">1080p · merged</text>
  </g>

  <!-- sparkles -->
  <g fill="#ffb547">
    <path d="M472 64 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4 z"/>
    <path d="M30 172 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill-opacity=".7"/>
  </g>
  <g fill="#a78bfa">
    <path d="M500 150 l2.5 7 l7 2.5 l-7 2.5 l-2.5 7 l-2.5 -7 l-7 -2.5 l7 -2.5 z"/>
    <path d="M276 404 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill-opacity=".7"/>
  </g>
</svg>
